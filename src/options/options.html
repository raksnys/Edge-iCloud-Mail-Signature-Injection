<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iCloud Mail Signature</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>iCloud Mail Format &amp; Signature</h1>

    <section class="card">
      <label class="check"><input type="checkbox" id="enableFormat"> Always turn on <strong>Format message</strong> when composing</label>
      <label class="check"><input type="checkbox" id="enableSignature"> Add my signature</label>
      <label class="check"><input type="checkbox" id="includeInReplies"> Also add it to replies and forwards</label>
      <label class="check"><input type="checkbox" id="replaceNativeSignature"> Replace iCloud's built-in signature (avoids two signatures)</label>
    </section>

    <section class="card">
      <label for="signatureHtml" class="field-label">Signature HTML</label>
      <textarea id="signatureHtml" spellcheck="false" rows="12" placeholder="&lt;div&gt;--&lt;/div&gt;&#10;&lt;div&gt;&lt;b&gt;Your Name&lt;/b&gt;&lt;/div&gt;&#10;&lt;div&gt;&lt;a href=&quot;https://example.com&quot;&gt;example.com&lt;/a&gt;&lt;/div&gt;"></textarea>
      <p class="hint">Inline styles, links and images (https or base64) work. Scripts, forms and event handlers are stripped.</p>

      <span class="field-label">Preview</span>
      <iframe id="preview" sandbox="" title="Signature preview"></iframe>
    </section>

    <div class="actions">
      <button id="save" type="button">Save</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </main>

  <script src="../shared/settings.js"></script>
  <script src="../content/signature-core.js"></script>
  <script src="options.js"></script>
</body>
</html>
